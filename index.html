<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#100b0d;--pn:#1a1315;--p2:#241b1e;--ln:#31262a;--ink:#f6f1f2;--mut:#ab9ca1;--ph:#85767b;--ac:#e11d38;--acl:#ff7a8b;--ok:#4cd08f;--er:#ffb347;--f:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--m:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{color-scheme:dark;background:var(--bg)}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--f);-webkit-text-size-adjust:100%}
button{font-family:var(--f)}
:focus-visible{outline:2px solid var(--acl);outline-offset:2px}

/* Susunan utama: satu layar di ponsel */
.app{display:flex;flex-direction:column;gap:12px;height:100vh;height:100dvh;min-height:600px;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.lg{width:36px;height:36px;border-radius:50%;flex:none}
.tt{flex:1;min-width:0}
h1{font-size:17px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.tt p{font-size:12px;color:var(--mut)}
.tx{min-height:44px;padding:0 10px;background:none;border:0;border-radius:8px;color:var(--mut);font:600 13px var(--f);cursor:pointer}
.tx:hover{color:var(--ink)}
.ib{width:44px;height:44px;display:grid;place-items:center;flex:none;background:none;border:0;border-radius:10px;color:var(--ink);cursor:pointer}
.ib:hover{background:var(--p2)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Pilihan (jenis akun, template, template pesan) */
.seg{display:grid;gap:4px;padding:4px;background:var(--pn);border:1px solid var(--ln);border-radius:12px}
.k2{grid-template-columns:1fr 1fr}
.k4{grid-template-columns:repeat(4,1fr)}
.tpl{position:relative;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.tpl::-webkit-scrollbar{display:none}
.tpl .opt{flex:none;padding:0 16px}
.opt{min-width:0;min-height:40px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 6px;background:none;border:0;border-radius:8px;color:var(--mut);font:600 13px var(--f);white-space:nowrap;cursor:pointer}
.k2 .opt{min-height:44px}
.opt img{width:24px;height:24px;flex:none}
.opt:not([aria-checked=true]):hover{background:var(--p2);color:var(--ink)}
.opt[aria-checked=true]{background:var(--ac);color:#fff}

/* Isian */
.grp{background:var(--pn);border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.fld{min-height:60px;display:flex;align-items:center;padding:6px 4px 6px 14px;border-bottom:1px solid var(--ln)}
.fld:last-child{border-bottom:0}
.fld>div{flex:1;min-width:0}
.fld label{display:block;font-size:12px;font-weight:600;line-height:1.3;color:var(--mut)}
.fld label span{font-weight:400}

 std:['Terima kasih','Halo Tuan, terima kasih sudah order \ud83d\ude4f\nAkun *{jenis}* kamu sudah selesai dan gambarnya sudah dikirim di atas ya.\n\n{catatan}\n\n\u2014 {admin}'],

 cra:['Cara masuk','Cara masuk akun *{jenis}*:\n1. Buka game lalu pilih login dengan akun.\n2. Isi data login sesuai gambar di atas (huruf besar dan kecil berpengaruh).\n3. Setelah berhasil masuk, segera ganti password.\n\n{catatan}\n\u2014 {admin}'],
 amn:['Keamanan','Tips keamanan akun *{jenis}*:\n- Jangan bagikan data akun ke siapa pun.\n- Ganti password setelah login pertama.\n- Simpan gambar akun sebagai arsip.\n\n\u2014 {admin}'],

 knd:['Kendala','Kalau ada kendala saat memakai akun *{jenis}*, balas pesan ini beserta screenshot masalahnya ya Tuan. Admin bantu secepatnya \ud83d\ude4f\n\u2014 {admin}'],
 tes:['Testimoni','Kalau sudah puas dengan pesanannya, boleh kirim testimoni atau bukti transaksi ya Tuan biar admin makin semangat \ud83d\ude4c\nTerima kasih sudah percaya di KZRIZUSMO!\n\u2014 {admin}'],

 pmb:['Pembayaran','Pembayaran sudah kami terima ya Tuan \u2705 Terima kasih!\nAkun *{jenis}* sedang disiapkan, mohon tunggu sebentar.\n\u2014 {admin}'],

pvw.addEventListener('touchend',function(e){var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0?1:-1)},{passive:true});
cv.onclick=function(){$('zi').src=cv.toDataURL('image/png');$('zm').showModal()};
document.addEventListener('click',function(e){if(navigator.vibrate&&e.target.closest&&e.target.closest('.act,.btn,.opt,.lk,.ib,.hb'))navigator.vibrate(8)});
cap();

})();

/* ===== PWA: pasang aplikasi + service worker ===== */
var dip=null,ios=/iphone|ipad|ipod/i.test(navigator.userAgent),sa=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dip=e;$('pw').style.display=''});
window.addEventListener('appinstalled',function(){dip=null;$('pw').style.display='none';toast('Aplikasi terpasang.')});
$('pw').onclick=function(){if(dip){var d=dip;dip=null;d.prompt();d.userChoice.then(function(r){if(r.outcome==='accepted')$('pw').style.display='none';else dip=d})}else toast('Di iPhone: ketuk Bagikan, lalu Tambah ke Layar Utama.')};
if(ios&&!sa)$('pw').style.display='';
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script>
